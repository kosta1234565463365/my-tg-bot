<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Тест кнопок</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

body {
    padding: 30px 20px;
}

h1 {
    text-align: center;
}

button {
    display: block;
    width: 100%;
    min-height: 70px;
    margin: 20px 0;
    border: none;
    border-radius: 20px;
    background: #168b5c;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(0.98);
}

#result {
    margin-top: 30px;
    padding: 25px;
    border-radius: 20px;
    background: white;
    font-size: 22px;
    text-align: center;
}

#debug {
    margin-top: 20px;
    padding: 15px;
    background: #222;
    color: #00ff66;
    border-radius: 15px;
    font-family: monospace;
}
</style>
</head>

<body>

<h1>Тест кнопок</h1>

<button id="test1">
    🔘 НАЖМИ МЕНЯ
</button>

<button id="test2">
    🧮 РАССЧИТАТЬ
</button>

<button id="test3">
    ⚙️ НАСТРОЙКИ
</button>

<div id="result">
    Пока ничего не нажато
</div>

<div id="debug">
    JavaScript запускается...
</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const result = document.getElementById("result");
    const debug = document.getElementById("debug");

    debug.innerHTML = "JavaScript OK";

    function testButton(number, text) {

        result.innerHTML = text;

        debug.innerHTML =
            "Кнопка " + number + " нажата";

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {
            try {
                window.Telegram.WebApp.HapticFeedback
                    .impactOccurred("medium");
            } catch (e) {}
        }
    }

    document
        .getElementById("test1")
        .addEventListener("click", function () {
            testButton(1, "✅ ПЕРВАЯ КНОПКА РАБОТАЕТ");
        });

    document
        .getElementById("test2")
        .addEventListener("click", function () {
            testButton(2, "🧮 КАЛЬКУЛЯТОР РАБОТАЕТ");
        });

    document
        .getElementById("test3")
        .addEventListener("click", function () {
            testButton(3, "⚙️ НАСТРОЙКИ РАБОТАЮТ");
        });

});

</script>

</body>
</html>
