<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор теплиц</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#182018;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}h1{font-size:22px;margin:4px 0 16px}.muted{color:#667066;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.model{border:2px solid #e4e9e3;border-radius:14px;padding:12px;cursor:pointer}.model.sel{border-color:#27864a;background:#f0faf3}.model b{display:block;margin-bottom:5px}.tag{font-size:12px;color:#667066}select,input{width:100%;padding:12px;border:1px solid #ccd4cc;border-radius:10px;font-size:16px;background:#fff}label{display:block;font-size:13px;margin:10px 0 6px;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0ed}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:9px;background:#e9eee9;font-size:20px}.qty span{min-width:24px;text-align:center}button.primary{width:100%;border:0;border-radius:12px;background:#258344;color:white;padding:14px;font-size:17px;font-weight:700;margin-top:12px}.calc{background:#f7faf7;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.55}.total{font-size:26px;font-weight:800;margin-top:10px}</style></head><body><div class="wrap"><h1>Профессиональный калькулятор теплиц</h1><div class="card"><div class="muted">Каркас + поликарбонат 4 мм</div><div id="models" class="grid" style="margin-top:12px"></div></div><div class="card"><label>Длина теплицы</label><select id="length"></select><div class="row"><div><label>Сборка</label><select id="assembly"><option value="0">Не требуется</option><option value="1">Требуется</option></select></div><div><label>Километры от МКАД</label><input id="km" type="number" min="0" value="0"></div></div></div><div class="card"><b>Дополнительные товары</b><div id="opts"></div></div><div class="card"><div class="muted">Текущий расчет</div><div id="result" class="calc" style="margin-top:8px"></div><div class="total" id="total"></div><button class="primary" onclick="copyResult()">Скопировать расчет</button></div></div><script>
const models=[
{name:'Счастье Садовода',desc:'Арка • 3×2.1 м • труба 40×20',prices:{4:20900,6:38300,8:47600,10:57000}},
{name:'Каплевидная',desc:'Стрелка • 3×2.4 м • труба 40×20',prices:{4:28900,6:37200,8:44640}},
{name:'Терем',desc:'Двускатная • 3×2.75 м • труба 40×20',prices:{4:29800,6:38700,8:46200}},
{name:'Звезда',desc:'Арка усиленная • ферма 20×20',prices:{4:26400,6:43100,8:53900,10:64700}},
{name:'Сказка',desc:'Прямостенная • ферма 20×20',prices:{4:25500,6:42300,8:52100,10:61900}},
{name:'Сказка Титан',desc:'Прямостенная • ферма 40×20',prices:{4:34200,6:52800,8:63400,10:74200}},
{name:'Алтайская сказка',desc:'Капля усиленная • ферма 40×20',prices:{4:45100,6:59300,8:72100}}
];
const assembly={4:9900,6:11900,8:13900,10:15900};
const opts=[
{id:'wood',name:'Фундамент из бруса 100×100 мм',desc:'Пропитанный сосновый брус под основание.',prices:{4:2500,6:3500,8:4500,10:5500},q:0},
{id:'partition',name:'Внутренняя перегородка с покрытием',desc:'Металлическая рама с поликарбонатом и дверью.',fixed:4500,q:0},
{id:'vent',name:'Дополнительная боковая форточка',desc:'Для дополнительного проветривания.',fixed:1500,q:0},
{id:'auto',name:'Автомат для проветривания',desc:'Термопривод без электричества.',fixed:2500,q:0},
{id:'drip',name:'Система капельного полива',desc:'Шланги и капельницы для полива под корень.',fixed:3500,q:0},
{id:'tape',name:'Паро-пропускающая перфолента + торцевой профиль',desc:'Защита сот поликарбоната.',fixed:1650,q:0},
{id:'beds',name:'Оцинкованные бордюры для грядок, 3 ряда',desc:'Металлические бортики.',prices:{4:4000,6:5500,8:7000},q:0},
{id:'premium',name:'Премиум-поликарбонат',desc:'Доплата за 6 мм или 4 мм с УФ-биослоем.',prices:{4:6600,6:8800,8:11000},q:0}
];let mi=0;const modelsEl=document.getElementById('models');models.forEach((m,i)=>{const d=document.createElement('div');d.className='model';d.innerHTML=`<b>${m.name}</b><span class="tag">${m.desc}</span>`;d.onclick=()=>{mi=i;render()};modelsEl.appendChild(d)});function fmt(n){return n.toLocaleString('ru-RU')+' руб.'}function render(){document.querySelectorAll('.model').forEach((x,i)=>x.classList.toggle('sel',i===mi));const p=models[mi].prices;length.innerHTML=Object.keys(p).map(x=>`<option>${x}</option>`).join('');document.getElementById('opts').innerHTML=opts.map((o,i)=>`<div class="opt"><div><b>${o.name}</b><div class="muted">${o.desc}</div></div><div class="qty"><button onclick="chg(${i},-1)">−</button><span id="q${i}">${o.q}</span><button onclick="chg(${i},1)">+</button></div></div>`).join('');update()}function chg(i,d){opts[i].q=Math.max(0,opts[i].q+d);document.getElementById('q'+i).textContent=opts[i].q;update()}function update(){const len=+length.value||+Object.keys(models[mi].prices)[0],base=models[mi].prices[len],asm=document.getElementById('assembly').value==='1'?assembly[len]:0,km=Math.max(0,+document.getElementById('km').value||0),delivery=km===0?0:(km>30?(km-30)*55+900:900);let lines=[],extra=0;opts.forEach(o=>{if(o.q){const unit=o.fixed??o.prices[len];const sum=unit*o.q;extra+=sum;lines.push(`${o.name}: ${o.q} × ${fmt(unit)} = ${fmt(sum)}`)}});const total=base+asm+delivery+extra;document.getElementById('result').textContent=`📊 РАСЧЕТ СТОИМОСТИ ЗАКАЗА:\n- Теплица ${models[mi].name} ${len}м: ${fmt(base)}\n- Сборка: ${asm?fmt(asm):'Не требуется'}\n- Фундамент (брус): ${opts[0].q?fmt(opts[0].prices[len]*opts[0].q):'Не требуется'}\n- Доставка (${km} км от МКАД) + разгрузка: ${delivery?fmt(delivery):(km===0?'0 руб. (Самовывоз)':'0 руб.')}\n\n- Дополнительные опции и товары:\n${lines.length?lines.join('\n'):'Не выбраны'}\n---\n💰 ИТОГО К ОПЛАТЕ: ${fmt(total)}`;document.getElementById('total').textContent='ИТОГО: '+fmt(total)}document.getElementById('length').addEventListener('change',update);document.getElementById('assembly').addEventListener('change',update);document.getElementById('km').addEventListener('input',update);function copyResult(){navigator.clipboard?.writeText(document.getElementById('result').textContent).then(()=>alert('Расчет скопирован'))}render();
</script></body></html>
